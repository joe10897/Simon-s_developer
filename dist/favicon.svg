<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Base Chassis -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#3f3f46" stroke-width="2"/>
  
  <!-- Glowing Status Light -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981"/>
  
  <!-- SW Monogram -->
  <text x="29" y="44" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">SW</text>
  
  <!-- Subtle Terminal Underline / Cyan Highlight -->
  <rect x="14" y="50" width="36" height="3" rx="1.5" fill="#38bdf8"/>
</svg>
